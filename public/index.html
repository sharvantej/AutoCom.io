<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Bunny</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="editBar" class="tool-dock">
      <div class="tool-dock-head">
        <span>Edit Mode</span>
        <div class="tool-head-actions">
          <button class="tool-head-btn" type="button" data-tool-action="shortcuts" title="Help">?</button>
          <button class="tool-head-btn" type="button" data-tool-action="toggle-edit" title="Exit Edit">x</button>
        </div>
      </div>
      <div class="tool-grid" role="group" aria-label="Layout tools">
        <button class="tool-btn tool-mode-btn is-active" type="button" data-tool-action="set-mode-move" data-tool-mode="move"><span class="tool-ico">M</span><span class="tool-txt">Move</span></button>
        <button class="tool-btn tool-mode-btn" type="button" data-tool-action="set-mode-resize" data-tool-mode="resize"><span class="tool-ico">R</span><span class="tool-txt">Resize</span></button>
        <button class="tool-btn" type="button" data-tool-action="add"><span class="tool-ico">+</span><span class="tool-txt">Button</span></button>
        <button class="tool-btn" type="button" data-tool-action="add-label"><span class="tool-ico">T</span><span class="tool-txt">Label</span></button>
        <button class="tool-btn" type="button" data-tool-action="add-image"><span class="tool-ico">I</span><span class="tool-txt">Image</span></button>
        <button class="tool-btn" type="button" data-tool-action="delete"><span class="tool-ico">x</span><span class="tool-txt">Delete</span></button>
      </div>
      <div class="tool-scroll">
        <label for="scrollModeSelect">Scrolling:</label>
        <select id="scrollModeSelect">
          <option value="true">True</option>
          <option value="false">False</option>
          <option value="vertical">Vertical</option>
          <option value="horizontal">Horizontal</option>
          <option value="always">Always</option>
        </select>
      </div>
      <div class="tool-canvas">
        <label for="canvasBgInput">Canvas BG:</label>
        <input id="canvasBgInput" type="color" value="#252c36" />
      </div>
      <div class="tool-options">
        <label><input id="snapGridCheckbox" type="checkbox" /> Snap to Grid</label>
        <label><input id="showBorderCheckbox" type="checkbox" checked /> Show Borders</label>
        <label>Border Color <input id="borderColorInput" type="color" value="#576172" /></label>
      </div>
      <input id="imagePicker" type="file" accept="image/*" hidden />
      <div id="buttonInspector" class="button-inspector" aria-label="Selected button controls">
        <label class="inspector-wide">
          Title
          <input id="btnLabelInput" type="text" />
        </label>
        <label>
          X
          <input id="btnXInput" type="number" min="0" step="1" />
        </label>
        <label>
          Y
          <input id="btnYInput" type="number" min="0" step="1" />
        </label>
        <label>
          W
          <input id="btnWInput" type="number" min="60" step="1" />
        </label>
        <label>
          H
          <input id="btnHInput" type="number" min="40" step="1" />
        </label>
        <label>
          Text px
          <input id="btnFsInput" type="number" min="8" max="120" step="1" />
        </label>
        <label>
          BG
          <input id="btnBgInput" type="color" />
        </label>
        <label>
          Text
          <input id="btnTextColorInput" type="color" />
        </label>
      </div>
      <span id="dirtyBadge" class="dirty-badge">Unsaved</span>
    </div>

    <div id="rightSidebar" class="right-sidebar">
      <div class="right-tabs" role="tablist" aria-label="Sidebar tabs">
        <button id="tabConnections" class="right-tab" type="button" role="tab" aria-selected="false">
          <span class="heroicon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75h7.5v7.5h-7.5zm9 0h7.5v7.5h-7.5zm-9 9h7.5v7.5h-7.5zm9 0h7.5v7.5h-7.5z" />
            </svg>
          </span>
          <span>Connections</span>
        </button>
        <button id="tabLogs" class="right-tab active" type="button" role="tab" aria-selected="true">
          <span class="heroicon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5m-16.5 5.25h16.5m-16.5 5.25h16.5" />
            </svg>
          </span>
          <span>Action Logs</span>
        </button>
      </div>
      <div class="right-body">
        <div id="connections-panel" class="sidebar-pane">
          <div id="connections-view"></div>
          <div id="connections-edit" style="display: none"></div>
        </div>

        <div id="logPanel" class="sidebar-pane active">
          <div id="logList"></div>
        </div>
      </div>
      <div class="right-footer">
        <button id="addDeviceBtn" class="right-footer-btn" type="button">
          <span class="heroicon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </span>
          <span>Add Device</span>
        </button>
        <button id="manageDeviceBtn" class="right-footer-btn" type="button">
          <span class="heroicon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828z" />
            </svg>
          </span>
          <span>Manage Device</span>
        </button>
      </div>
    </div>
    <button
      id="sidebarDockToggle"
      class="sidebar-dock-toggle"
      type="button"
      aria-controls="rightSidebar"
      aria-label="Toggle Connections and Logs panel"
      aria-expanded="true"
      title="Close Connections and Logs panel"
    >
      <span class="dock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 6l6 6-6 6"
          />
        </svg>
      </span>
      <span class="dock-label">Toggle Connections and Logs panel</span>
    </button>

    <div id="dashboardViewport">
      <div id="canvas"></div>
    </div>

    <div id="sequenceEditorModal" class="seq-modal hidden" aria-hidden="true">
      <div class="seq-modal-backdrop" data-seq-close="true"></div>
      <div class="seq-modal-content">
        <div class="seq-topbar">
          <h2 class="typography-h2">Button Sequence Editor</h2>
          <div class="seq-meta">
            <label>
              Label
              <input id="seq-button-label" type="text" />
            </label>
            <label>
              Color
              <input id="seq-button-color" type="color" />
            </label>
            <label>
              Preset
              <select id="seq-preset-select"></select>
            </label>
            <label>
              X
              <input id="seq-button-x" type="number" min="0" />
            </label>
            <label>
              Y
              <input id="seq-button-y" type="number" min="0" />
            </label>
            <label>
              Width
              <input id="seq-button-w" type="number" min="60" />
            </label>
            <label>
              Height
              <input id="seq-button-h" type="number" min="40" />
            </label>
            <label>
              Text (px)
              <input id="seq-button-font-size" type="number" min="8" max="120" />
            </label>
            <button id="seq-insert-preset-btn" type="button">Insert Preset</button>
          </div>
        </div>

        <div class="seq-main">
          <div class="seq-left">
            <div class="seq-left-actions">
              <button id="seq-add-task-root-btn" type="button">+ Task</button>
              <button id="seq-add-delay-root-btn" type="button">+ Delay</button>
              <button id="seq-add-parallel-root-btn" type="button">+ Parallel</button>
            </div>
            <div id="seq-errors" class="seq-errors"></div>
            <div id="seq-rows" class="seq-rows"></div>
          </div>

          <div class="seq-right">
            <div id="seq-form" class="seq-form"></div>
          </div>
        </div>

        <div class="seq-footer">
          <button id="seq-delete-btn" class="seq-danger" type="button">
            Delete Button
          </button>
          <div class="seq-footer-right">
            <button id="seq-cancel-btn" type="button">Cancel</button>
            <button id="seq-apply-btn" class="seq-primary" type="button">
              Apply
            </button>
            <button id="seq-apply-close-btn" class="seq-primary" type="button">
              Apply & Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="saveToast" class="save-toast" role="status" aria-live="polite"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      window.socket = io();
    </script>
    <script src="sequence-editor.js"></script>
    <script src="main.js"></script>
    <script src="connections.js"></script>
  </body>
</html>
